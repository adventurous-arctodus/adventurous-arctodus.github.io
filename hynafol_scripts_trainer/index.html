<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hynafol Scripts Trainer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- LOGIN -->
  <div id="login-screen" class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="card" style="width:360px;">
      <div class="card-body p-4">
        <h4 class="card-title mb-4">Hynafol Scripts Trainer</h4>
        <div class="mb-3">
          <label for="login-pw" class="form-label">Password</label>
          <input type="password" class="form-control" id="login-pw" autocomplete="current-password">
        </div>
        <div id="login-error" class="text-danger small mb-3 d-none" aria-live="polite">Incorrect password.</div>
        <button class="btn btn-primary w-100" id="login-btn">Sign In</button>
      </div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="main-app" class="d-none">

    <nav class="navbar bg-body-tertiary border-bottom px-3 py-2 gap-3 flex-wrap">
      <span class="navbar-brand fw-semibold me-2 mb-0">Hynafol Scripts Trainer</span>

      <div class="d-flex align-items-center gap-2">
        <label for="script-select" class="form-label mb-0 small text-nowrap">Script</label>
        <select id="script-select" class="form-select form-select-sm" style="min-width:180px;" aria-label="Select script">
          <option value="">— Select —</option>
        </select>
        <span id="font-status" class="small text-secondary text-nowrap"></span>
      </div>

      <div class="d-flex gap-1 flex-wrap ms-auto" id="main-nav" role="navigation" aria-label="Screens"></div>

      <button class="btn btn-outline-secondary btn-sm"
        onclick="sessionStorage.clear();location.reload();">Log Out</button>
    </nav>

    <main class="container-lg py-4" id="screen-container">
      <p class="text-secondary">Select a script above to begin.</p>
    </main>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/core.js"></script>
<script src="js/screens.js"></script>
<script src="js/app.js"></script>
</body>
</html>
